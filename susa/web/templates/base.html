<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}SuSa-AI{% endblock %} · SuSa-AI</title>
<style>
:root { --bg:#fbfaf7; --fg:#1d1d1b; --muted:#6b6a65; --line:#dedbd2; --card:#fff; --accent:#2f5d8a; --warn:#9a5b00; --warnbg:#fff4e0;
        --bad:#a1262b; --badbg:#fde9ea; --ok:#2d6a3e; --okbg:#e6f3e9; --quote:#efe6ff; --evid:#fff1a8; --link:#e3f0ff; }
@media (prefers-color-scheme: dark) { :root { --bg:#17181a; --fg:#e8e6e1; --muted:#a19f99; --line:#34353a; --card:#1f2023; --accent:#8fb8e3;
        --warn:#e6b35c; --warnbg:#3a2c12; --bad:#f08b8f; --badbg:#3b1a1c; --ok:#8fd19f; --okbg:#173022; --quote:#3a2f55; --evid:#4a4214; --link:#1d3146; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
header { border-bottom:1px solid var(--line); background:var(--card); padding:10px 16px; display:flex; gap:18px; align-items:center; flex-wrap:wrap; }
header b { font-size:16px; } header a { color:var(--fg); text-decoration:none; } header a:hover { color:var(--accent); }
main { max-width:1280px; margin:0 auto; padding:16px; }
a { color:var(--accent); }
h1 { font-size:22px; margin:6px 0 12px; } h2 { font-size:17px; margin:22px 0 8px; } h3 { font-size:15px; margin:14px 0 6px; }
table { border-collapse:collapse; width:100%; font-size:14px; } th,td { text-align:left; padding:5px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
th { color:var(--muted); font-weight:600; }
.card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin:10px 0; }
.muted { color:var(--muted); } .small { font-size:13px; }
.tag { display:inline-block; padding:1px 7px; border-radius:10px; font-size:12px; border:1px solid var(--line); margin:1px 2px; white-space:nowrap; }
.tag.synth { background:var(--warnbg); color:var(--warn); border-color:var(--warn); }
.tag.bad { background:var(--badbg); color:var(--bad); border-color:var(--bad); }
.tag.ok { background:var(--okbg); color:var(--ok); border-color:var(--ok); }
.banner { padding:8px 12px; border-radius:6px; margin:8px 0; }
.banner.warn { background:var(--warnbg); color:var(--warn); } .banner.bad { background:var(--badbg); color:var(--bad); } .banner.ok { background:var(--okbg); color:var(--ok); }
.cols { display:grid; grid-template-columns:1fr 1fr; gap:14px; } @media (max-width:900px) { .cols { grid-template-columns:1fr; } }
.passage { font-family: Georgia, "Iowan Old Style", serif; font-size:15.5px; line-height:1.6; }
.ctx { color:var(--muted); font-size:14px; }
mark { color:inherit; border-radius:2px; } mark.quote { background:var(--quote); } mark.evidence { background:var(--evid); } mark.link { background:var(--link); }
.unit { border-left:3px solid var(--line); padding:4px 0 4px 12px; margin:10px 0; } .unit:target { border-left-color:var(--accent); }
.para { margin:6px 0; } .para.blockquote { border-left:3px solid var(--quote); padding-left:10px; font-style:italic; } .para.h { font-weight:700; font-family:system-ui; }
form.inline { display:inline; } input[type=text], textarea, select { font:inherit; padding:4px 6px; border:1px solid var(--line); border-radius:4px; background:var(--bg); color:var(--fg); }
textarea { width:100%; } button { font:inherit; padding:4px 10px; border-radius:5px; border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer; }
button.secondary { background:transparent; color:var(--accent); }
details > summary { cursor:pointer; color:var(--accent); }
dl.kv { display:grid; grid-template-columns:max-content 1fr; gap:2px 12px; margin:0; } dl.kv dt { color:var(--muted); } dl.kv dd { margin:0; }
.wrap { overflow-wrap:anywhere; }
.checks { columns:2; font-size:13px; } @media (max-width:700px) { .checks { columns:1; } }
</style>
</head>
<body>
<header>
  <b><a href="{{ url_for('overview') }}">SuSa-AI</a></b>
  <a href="{{ url_for('overview') }}">Korpus</a>
  <a href="{{ url_for('search') }}">Suche</a>
  <a href="{{ url_for('sources') }}">Quellen</a>
  <a href="{{ url_for('history') }}">Verlauf</a>
  <a href="{{ url_for('export') }}">Export (JSONL)</a>
  <span class="muted small">Forschungswerkzeug mit menschlicher Prüfung · kein Wahrheitsurteil</span>
</header>
<main>
{% block body %}{% endblock %}
</main>
</body>
</html>
